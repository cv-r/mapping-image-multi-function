<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mapping-image-multi-function — 图片转 Base64 / 压缩 Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        color: #333;
        padding: 24px;
      }
      h1 {
        text-align: center;
        margin-bottom: 8px;
      }
      .subtitle {
        text-align: center;
        color: #888;
        margin-bottom: 32px;
      }
      .demo {
        max-width: 720px;
        margin: 0 auto 32px;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .demo h2 {
        font-size: 18px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid #e8e8e8;
      }
      .demo .preview {
        margin-top: 16px;
      }
      .demo .preview img {
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid #eee;
      }
      .info {
        margin-top: 8px;
        font-size: 13px;
        color: #666;
      }
      .info span {
        font-weight: 600;
        color: #1890ff;
      }
      label {
        display: inline-block;
        margin-right: 16px;
        margin-bottom: 8px;
        font-size: 14px;
      }
      input[type="range"] {
        width: 140px;
        vertical-align: middle;
      }
      .state {
        margin-top: 8px;
        font-size: 13px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>mapping-image-multi-function</h1>
    <p class="subtitle">图片 URL → Base64 · Base64 压缩</p>

    <!-- Demo 1: URL → Base64 -->
    <div class="demo">
      <h2>1. 图片 URL → Base64</h2>
      <p class="state" id="demo1State">准备加载…</p>
      <div class="preview" id="demo1Preview"></div>
      <p class="info">Base64 长度: <span id="demo1Len">—</span></p>
    </div>

    <!-- Demo 2: Base64 压缩 -->
    <div class="demo">
      <h2>2. Base64 压缩</h2>
      <label
        >Quality:
        <input
          type="range"
          id="qualitySlider"
          min="0.1"
          max="1"
          step="0.1"
          value="0.3"
      /></label>
      <span id="qualityVal">0.3</span>
      <p class="state" id="demo2State">等待 Demo 1 完成后自动触发…</p>
      <div class="preview" id="demo2Preview"></div>
      <p class="info">
        压缩前: <span id="demo2Before">—</span> &nbsp;|&nbsp; 压缩后:
        <span id="demo2After">—</span> &nbsp;|&nbsp; 减小:
        <span id="demo2Ratio">—</span>
      </p>
    </div>

    <script type="module">
      import { ChangeImage } from "./dist/index.js";

      const imgUrl = "./image.png";

      let originalBase64 = "";

      // 创建实例，提供默认配置
      const ci = new ChangeImage({
        quality: 0.8,
        type: "image/jpeg",
      });

      // ---------- Demo 1: 图片 URL → Base64 ----------
      function showPreview(containerId, base64, width, height) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        const img = document.createElement("img");
        img.src = base64;
        container.appendChild(img);
        const p = document.createElement("p");
        p.className = "info";
      }
      setInfo("demo1State", "加载中…");
      ci.imageUrlToBase64({
        src: imgUrl,
        width: 400,
        callback: (base64) => {
          originalBase64 = base64;
          showPreview("demo1Preview", base64, 400, 400);
          setText("demo1Len", `${base64.length.toLocaleString()} 字符`);
          setInfo("demo1State", "完成");

          // 自动触发 Demo 2
          setInfo("demo2State", "压缩中…");
          compressWithQuality(0.3);
        },
      });

      // ---------- Demo 2: Base64 压缩 ----------
      function compressWithQuality(q) {
        const lenBefore = originalBase64.length;
        setText("demo2Before", `${lenBefore.toLocaleString()} 字符`);
        setInfo("demo2State", "压缩中…");

        ci.photoCompress({
          base64Url: originalBase64,
          quality: q,
          callback: (compressed) => {
            const lenAfter = compressed.length;
            const ratio = ((1 - lenAfter / lenBefore) * 100).toFixed(1);
            showPreview("demo2Preview", compressed);
            setText("demo2After", `${lenAfter.toLocaleString()} 字符`);
            setText("demo2Ratio", `${ratio}%`);
            setInfo("demo2State", "完成");
          },
        });
      }

      // 滑块控制压缩率
      const slider = document.getElementById("qualitySlider");
      const qualityVal = document.getElementById("qualityVal");
      slider.addEventListener("input", () => {
        const q = parseFloat(slider.value);
        qualityVal.textContent = q;
        if (originalBase64) compressWithQuality(q);
      });

      // helpers
      function setText(id, text) {
        document.getElementById(id).textContent = text;
      }
      function setInfo(id, text) {
        const el = document.getElementById(id);
        if (el.tagName === "P" && el.className === "state")
          el.textContent = text;
        else setText(id, text);
      }
    </script>
  </body>
</html>
